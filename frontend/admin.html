<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR CRM - Админ-панель</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-box">
            <h1>OCR CRM</h1>
            <p>Войдите в админ-панель</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Войти
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-container" id="adminPanel">
        <!-- Header -->
        <header class="header">
            <h1>📊 Панель управления</h1>
            <div class="header-actions">
                <a href="/" class="btn btn-outline btn-small">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    Загрузить фото
                </a>
                <button class="btn btn-outline btn-small" onclick="logout()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Выйти
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Всего заявок</h3>
                <div class="value" id="totalCount">0</div>
            </div>
            <div class="stat-card success">
                <h3>Отправлено в AMO</h3>
                <div class="value" id="sentCount">0</div>
                <div class="stat-detail" id="sentDetail" style="font-size: 0.85em; margin-top: 8px; color: rgba(255, 255, 255, 0.8);"></div>
            </div>
            <div class="stat-card warning">
                <h3>Ожидают отправки</h3>
                <div class="value" id="pendingCount">0</div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="table-section">
            <div class="table-header">
                <h2>Список заявок</h2>
                <div class="table-controls">
                    <input type="text" class="search-input" id="searchInput" placeholder="Поиск по ФИО...">
                    <select class="filter-select" id="filterSelect">
                        <option value="">Все заявки</option>
                        <option value="false">Не отправлены</option>
                        <option value="true">Отправлены</option>
                    </select>
                    <button class="btn btn-success btn-small" onclick="sendAllToAmo()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                        Отправить в АМО
                    </button>
                    <button class="btn btn-primary btn-small" onclick="exportToCSV()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Выгрузить в CSV
                    </button>
                    <button class="btn btn-outline btn-small" onclick="loadStudents()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Обновить
                    </button>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Тип заявки</th>
                            <th>ФИО</th>
                            <th>Школа</th>
                            <th>Класс</th>
                            <th>Телефон</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTable">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button id="prevPage" onclick="changePage(-1)">← Назад</button>
                <span id="pageInfo">Страница 1</span>
                <button id="nextPage" onclick="changePage(1)">Вперед →</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h2>Удалить заявку?</h2>
            <p>Это действие нельзя отменить. Заявка будет удалена навсегда.</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
                <button class="btn btn-danger" id="confirmDelete">Удалить</button>
            </div>
        </div>
    </div>

    <script src="/static/admin.js"></script>
</body>
</html>
